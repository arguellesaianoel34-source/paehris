services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_php
    volumes:
      - ./:/var/www/html
    networks:
      - erp_network
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - PHP_ENV=development
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: erp_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - erp_network
    depends_on:
      - php
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: erp_mysql
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_password_2024
      - MYSQL_DATABASE=uub4rmw23inpzxn9_erp
      - MYSQL_USER=uub4rmw23inpzxn9_pae_root
      - MYSQL_PASSWORD=959@M+U1GOat
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - ./db:/docker-entrypoint-initdb.d/sql
    networks:
      - erp_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_2024"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8 --collation-server=utf8_general_ci

networks:
  erp_network:
    driver: bridge

volumes:
  mysql_data:

