services:
  web:
    build: .
    container_name: pae_erp_web
    ports:
      - "8080:80"
      - "2222:22"
    volumes:
      - .:/var/www/html
      - ./uploads:/var/www/html/uploads
      - ./application/logs:/var/www/html/application/logs
      - ./application/cache:/var/www/html/application/cache
    depends_on:
      mysql:
        condition: service_healthy
      mysql_audit:
        condition: service_healthy
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
      - DOCKER_CONTAINER=true
      - SFTP_USER=developer
      - SFTP_PASSWORD=dev123
    networks:
      - pae_network

  mysql:
    image: mysql:8.0
    container_name: pae_erp_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: uub4rmw23inpzxn9_erp
      MYSQL_USER: uub4rmw23inpzxn9_pae_root
      MYSQL_PASSWORD: 959@M+U1GOat
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/main:/docker-entrypoint-initdb.d
    networks:
      - pae_network
    command: --default-authentication-plugin=mysql_native_password --sql_mode=""
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql_audit:
    image: mysql:8.0
    container_name: pae_erp_mysql_audit
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: uub4rmw23inpzxn9_erp_audit
      MYSQL_USER: uub4rmw23inpzxn9_pae_root
      MYSQL_PASSWORD: 959@M+U1GOat
    volumes:
      - mysql_audit_data:/var/lib/mysql
      - ./db/audit:/docker-entrypoint-initdb.d
    networks:
      - pae_network
    command: --default-authentication-plugin=mysql_native_password --sql_mode=""
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  mysql_audit_data:

networks:
  pae_network:
    driver: bridge

