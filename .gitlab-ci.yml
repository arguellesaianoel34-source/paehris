stages:
  - main
  - release

Development:
  only:
    - main
  stage: main
  before_script:
    - apt-get update -yqq
    - apt-get install -y lftp
  script:
    - git diff --name-only ${CI_COMMIT_BEFORE_SHA}...${CI_COMMIT_SHA} > /temp-deployment-text-${CI_JOB_ID}.txt
    - |
      echo "------------------------------------------------------"
      echo "Listing the files to be deployed...."
      echo "------------------------------------------------------"
      cat /temp-deployment-text-${CI_JOB_ID}.txt
      echo "------------------------------------------------------"
      echo "Syncing to destination server: /home/uub4rmw23inpzxn9/public_html/erp/"
      echo "------------------------------------------------------"

    # --- Start of the corrected script ---
    # This loop will process one file at a time, but uses lftp's ability
    - |
      while IFS= read -r file; do
        if [ -f "$file" ]; then # Ensure the item is a file
          echo "Uploading: $file"
          # We've added the '-d' flag here to enable debug mode
          lftp -d -c "
          set ftp:ssl-allow no;
          open -u ${FTP_USER},${FTP_PASSWORD} ftp.paenergy.ph;
          put -O /home/uub4rmw23inpzxn9/public_html/erp/ '$file'
          "
        fi
      done < /temp-deployment-text-${CI_JOB_ID}.txt
    # --- End of the corrected script ---

    - |
      echo "------------------------------------------------------"
      echo "Deployment finished successfully."
      echo "------------------------------------------------------"