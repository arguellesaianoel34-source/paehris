stages:
  - main
  - release

Development:
  only:
    - main
  stage: main
  script:
    - touch /temp-deployment-text-${CI_JOB_ID}.txt
    - git diff --name-only ${CI_COMMIT_BEFORE_SHA}...${CI_COMMIT_SHA} > /temp-deployment-text-${CI_JOB_ID}.txt
    - |
      echo ------------------------------------------------------
      echo Listing the files to be deploy....
      echo ------------------------------------------------------
      cat /temp-deployment-text-${CI_JOB_ID}.txt
      echo ------------------------------------------------------
      echo Syncing to destination server: ///
      echo ------------------------------------------------------

    # - eval rsync -a -u -i -r --ignore-errors --progress --human-readable --delete --verbose --timeout=600
    #   --files-from=/temp-deployment-text-${CI_JOB_ID}.txt
    #   --exclude '.gitlab-ci.yml'
    #   --exclude 'vendor'
    #   --exclude '.env'
    #   --exclude '.idea'
    #   --exclude '.git'
    #   --exclude 'storage'
    #   . ${FTP_USER}@${FTP_HOST}:${CI_PROJECT_DIR}
    - |
      echo ------------------------------------------------------
      echo Uploading files via FTP...
      echo ------------------------------------------------------
      while IFS= read -r file; do
        echo "Uploading: $file"
        ftp -n -i ftp.paenergy.ph << EOF
        user dev@paenergy.ph p@3_D3v2025##
        binary
        put "$file" "/home/uub4rmw23inpzxn9/public_html/erp/$file"
        bye
      EOF
      done < /temp-deployment-text-${CI_JOB_ID}.txt

