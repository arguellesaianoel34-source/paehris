stages:
  - main
  - release

Development:
  only:
    - main
  stage: main
  before_script:
    # Add lftp to the installation
    - apt-get update -yqq
    - apt-get install -y lftp
  script:
    # This part remains the same
    - git diff --name-only ${CI_COMMIT_BEFORE_SHA}...${CI_COMMIT_SHA} > /temp-deployment-text-${CI_JOB_ID}.txt
    - |
      echo "------------------------------------------------------"
      echo "Listing the files to be deployed...."
      echo "------------------------------------------------------"
      cat /temp-deployment-text-${CI_JOB_ID}.txt
      echo "------------------------------------------------------"
      echo "Syncing to destination server: /home/uub4rmw23inpzxn9/public_html/erp/"
      echo "------------------------------------------------------"

    # --- Start of the corrected script ---
    # Use lftp to upload all files from the list in one go.
    # It will create directories automatically.
    - |
      lftp -c "
      set ftp:ssl-allow no;
      open -u dev@paenergy.ph,p@3_D3v2025## ftp.paenergy.ph;
      mirror -R --verbose --parallel=5 --only-newer --files-from=/temp-deployment-text-${CI_JOB_ID}.txt . /home/uub4rmw23inpzxn9/public_html/erp/
      "
    # --- End of the corrected script ---

    - |
      echo "------------------------------------------------------"
      echo "Deployment finished successfully."
      echo "------------------------------------------------------"