stages:
  - build
  - test
  - deploy

variables:
  # Define deployment paths
  DEPLOY_PATH: "public_html/erp/"
  
build:
  stage: build
  image: php:8.1-cli
  before_script:
    - apt-get update -yqq
    - apt-get install -y git unzip
  script:
    - echo "Building application..."
    - composer install --no-dev --optimize-autoloader || echo "No composer.json found"
    - echo "Build completed successfully"
  artifacts:
    paths:
      - vendor/
    expire_in: 1 hour
  only:
    - main
    - develop

test:
  stage: test
  image: php:8.1-cli
  before_script:
    - apt-get update -yqq
    - apt-get install -y git
  script:
    - echo "Running PHP syntax checks..."
    - find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;
    - echo "All PHP files passed syntax check"
  only:
    - main
    - develop

deploy_production:
  stage: deploy
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache lftp
  script:
    - git diff --name-only ${CI_COMMIT_BEFORE_SHA}...${CI_COMMIT_SHA} > /temp-deployment-text-${CI_JOB_ID}.txt
    - |
      echo "------------------------------------------------------"
      echo "Listing the files to be deployed...."
      echo "------------------------------------------------------"
      cat /temp-deployment-text-${CI_JOB_ID}.txt
      echo "------------------------------------------------------"
      echo "Syncing to destination server: public_html/erp/"
      echo "------------------------------------------------------"

    # --- Start of the corrected script ---
    # This loop will process one file at a time, but uses lftp's ability
    - |
      while IFS= read -r file; do
        if [ -f "$file" ]; then
          # Get the directory path from the file (e.g., "app/Models")
          dir_path=$(dirname "$file")
          
          echo "Uploading: $file"
          
          lftp -c "
          set ftp:ssl-allow no;
          open -u ${FTP_USER},${FTP_PASSWORD} ftp.paenergy.ph;
          
          # STEP 1: Create the directory. -p is safe and does nothing if it already exists.
          mkdir -p \"${dir_path}\";
          
          # STEP 2: Put the file into the directory we just created.
          # The -O flag here correctly places the file inside the specified directory.
          put -O \"${dir_path}/\" \"${file}\";
          "
        fi
      done < /temp-deployment-text-${CI_JOB_ID}.txt
    # --- End of the corrected script ---

    - |
      echo "------------------------------------------------------"
      echo "Deployment finished successfully."
      echo "------------------------------------------------------"