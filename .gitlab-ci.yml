stages:
  - main
  - release

Development:
  only:
    - main
  stage: main
  before_script:
    # We will install the more powerful 'lftp' client instead of 'ftp'
    - apt-get update -yqq
    - apt-get install -y lftp
  script:
    # This part for getting the file list is correct and remains the same
    - git diff --name-only ${CI_COMMIT_BEFORE_SHA}...${CI_COMMIT_SHA} > /temp-deployment-text-${CI_JOB_ID}.txt
    - |
      echo "------------------------------------------------------"
      echo "Listing the files to be deployed...."
      echo "------------------------------------------------------"
      cat /temp-deployment-text-${CI_JOB_ID}.txt
      echo "------------------------------------------------------"
      echo "Syncing to destination server: /home/uub4rmw23inpzxn9/public_html/erp/"
      echo "------------------------------------------------------"

    # --- Start of the corrected deployment script ---
    # This single 'lftp' command replaces the entire 'while' loop.
    # It connects once, creates all necessary directories, and uploads all files from the list.
    - |
      lftp -c "
      set ftp:ssl-allow no;
      open -u ${FTP_USER},${FTP_PASSWORD} ${FTP_HOST};
      mirror -R --verbose --parallel=5 --only-newer --files-from=/temp-deployment-text-${CI_JOB_ID}.txt . /home/uub4rmw23inpzxn9/public_html/erp/
      "
    # --- End of the corrected deployment script ---

    - |
      echo "------------------------------------------------------"
      echo "Deployment finished successfully."
      echo "------------------------------------------------------"