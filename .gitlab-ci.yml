stages:
  - main
  - release

Development:
  only:
    - main
  stage: main
  before_script:
    - apt-get update -yqq
    - apt-get install -y lftp
    # Validate required environment variables
    - |
      if [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
        echo "Error: FTP_USER and FTP_PASSWORD environment variables must be set"
        exit 1
      fi
  script:
    # Get list of changed files
    - |
      if [ -n "$CI_COMMIT_BEFORE_SHA" ]; then
        git diff --name-only ${CI_COMMIT_BEFORE_SHA}...${CI_COMMIT_SHA} > /tmp/deployment-files-${CI_JOB_ID}.txt
      else
        # For initial commit, deploy all files
        git ls-files > /tmp/deployment-files-${CI_JOB_ID}.txt
      fi
    
    # Display files to be deployed
    - |
      echo "------------------------------------------------------"
      echo "Files to be deployed:"
      echo "------------------------------------------------------"
      cat /tmp/deployment-files-${CI_JOB_ID}.txt
      echo "------------------------------------------------------"
      
      # Check if there are files to deploy
      if [ ! -s /tmp/deployment-files-${CI_JOB_ID}.txt ]; then
        echo "No files to deploy. Exiting."
        exit 0
      fi
    
    # Deploy files via FTP
    - |
      echo "Starting FTP deployment to ftp.paenergy.ph..."
      
      while IFS= read -r file; do
        if [ -f "$file" ]; then
          # Get the directory path from the file
          dir_path=$(dirname "$file")
          
          echo "Uploading: $file to public_html/erp/$dir_path/"
          
          lftp -c "
          set ftp:ssl-allow no;
          set net:timeout 30;
          set net:max-retries 3;
          open -u $FTP_USER,$FTP_PASSWORD ftp.paenergy.ph || exit 1;
          
          # Change to the target directory
          cd public_html/erp || exit 1;
          
          # Create directory structure if needed
          mkdir -p '$dir_path' || true;
          
          # Upload the file
          put '$file' -o '$file' || exit 1;
          
          quit;
          " || {
            echo "Failed to upload $file"
            exit 1
          }
        else
          echo "Warning: File $file not found, skipping..."
        fi
      done < /tmp/deployment-files-${CI_JOB_ID}.txt
    
    # Cleanup and success message
    - |
      rm -f /tmp/deployment-files-${CI_JOB_ID}.txt
      echo "------------------------------------------------------"
      echo "Deployment completed successfully!"
      echo "------------------------------------------------------"